name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec

      - name: Install xcsift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/xcsift" "$HOME/.local/bin"
          gh release download v1.3.2-sunset.2 --repo SunsetWan/xcsift \
            --pattern "xcsift-v1.3.2-sunset.2-macos-arm64.tar.gz" --dir "$RUNNER_TEMP/xcsift"
          tar -xzf "$RUNNER_TEMP/xcsift/xcsift-v1.3.2-sunset.2-macos-arm64.tar.gz" -C "$RUNNER_TEMP/xcsift"
          install -m 0755 "$RUNNER_TEMP/xcsift/xcsift" "$HOME/.local/bin/xcsift"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare scripts
        run: chmod +x ./gradlew scripts/*.sh

      - name: Select iOS simulator
        run: echo "IOS_SIMULATOR_DESTINATION=$(scripts/select-ios-simulator-destination.sh)" >> "$GITHUB_ENV"

      - name: Validate OpenSpec specs
        run: openspec validate --specs --strict

      - name: Run KMP iOS simulator tests
        run: ./gradlew :deckstring:iosSimulatorArm64Test --console=plain

      - name: Build SwiftPM binary artifact
        run: ./gradlew :deckstring:prepareDeckStringDecoderSwiftPMBinaryRelease --console=plain

      - name: Verify SwiftPM binary artifact
        run: |
          scripts/verify-swiftpm-artifact.sh \
            deckstring/build/swiftpm-binary/DeckStringRuntime.xcframework.zip \
            deckstring/build/swiftpm-binary/DeckStringRuntime.xcframework.zip.checksum

      - name: Verify local SwiftPM binary consumer
        run: ./gradlew :deckstring:verifyDeckStringDecoderSwiftPMConsumer --console=plain

      - name: Upload SwiftPM binary artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DeckStringRuntime.xcframework
          path: |
            deckstring/build/swiftpm-binary/DeckStringRuntime.xcframework.zip
            deckstring/build/swiftpm-binary/DeckStringRuntime.xcframework.zip.checksum
          if-no-files-found: error
